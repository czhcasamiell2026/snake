<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: radial-gradient(circle at 15% 0%, #16283f 0%, #080c14 55%, #05070c 100%) fixed;
    font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6f1ff;
    user-select: none;
  }
  .app {
    width: min(92vw, 540px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  @supports (height: 100dvh) {
    .app { width: min(92vw, 540px, calc(100dvh - 180px)); }
  }
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 700;
    letter-spacing: .04em;
    background: linear-gradient(100deg, #6bffb8, #4fd6ff 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hint {
    margin: 4px 0 0;
    font-size: 12px;
    color: #7d93ab;
    letter-spacing: .02em;
  }
  .scores { display: flex; gap: 8px; }
  .stat {
    min-width: 78px;
    padding: 7px 12px;
    text-align: right;
    border-radius: 12px;
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(120, 210, 255, .12);
  }
  .stat span {
    display: block;
    font-size: 11px;
    color: #7d93ab;
    letter-spacing: .06em;
  }
  .stat strong {
    display: block;
    margin-top: 2px;
    font-size: 20px;
    font-weight: 700;
    color: #b9ffe0;
    font-variant-numeric: tabular-nums;
  }
  .board {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(90, 200, 255, .16);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55), inset 0 0 70px rgba(60, 220, 180, .06);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    background: rgba(5, 9, 16, .74);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .ov-title {
    margin: 0;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700;
    color: #d8ffe9;
  }
  .ov-desc {
    margin: 0;
    font-size: 13px;
    color: #8ba3bb;
    font-variant-numeric: tabular-nums;
  }
  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: .04em;
    color: #04160f;
    background: linear-gradient(135deg, #7dffc0, #3ee6c0);
    box-shadow: 0 10px 24px rgba(70, 255, 185, .28);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.06); box-shadow: 0 12px 30px rgba(70, 255, 185, .38); }
  .btn:active { transform: translateY(1px) scale(.985); }
  .btn.ghost {
    color: #bfe6ff;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(120, 210, 255, .2);
    box-shadow: none;
  }
  .btn.ghost:hover { background: rgba(255, 255, 255, .1); box-shadow: none; }
  .ov-btn { margin-top: 10px; }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .actions { display: flex; gap: 8px; align-items: center; }
  .actions .btn { padding: 9px 18px; font-size: 13px; }
  /* 自定义难度下拉：菜单固定向上展开，避免靠近页面底部时被裁切 */
  .diff { position: relative; }
  .diff-btn {
    appearance: none;
    -webkit-appearance: none;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px 9px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-family: inherit;
    color: #cfeaff;
    background: #131b2a;
    border: 1px solid rgba(120, 210, 255, .18);
    outline: none;
    cursor: pointer;
  }
  .diff-btn::after {
    content: '';
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 5px solid #8ba3bb;   /* 三角朝上，提示向上展开 */
  }
  .diff-btn:hover { background: #182337; border-color: rgba(120, 210, 255, .32); }
  .diff.open .diff-btn { border-color: rgba(110, 255, 200, .45); }
  .diff-menu {
    position: absolute;
    bottom: calc(100% + 6px);          /* 关键：锚定在按钮上方 */
    left: 0;
    min-width: 100%;
    margin: 0;
    padding: 5px;
    list-style: none;
    border-radius: 10px;
    background: #101825;
    border: 1px solid rgba(120, 210, 255, .22);
    box-shadow: 0 -12px 30px rgba(0, 0, 0, .55);
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity .15s ease, transform .15s ease, visibility .15s;
    z-index: 30;
  }
  .diff.open .diff-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .diff-menu li {
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    color: #a9c3da;
    white-space: nowrap;
    cursor: pointer;
  }
  .diff-menu li:hover { background: rgba(120, 210, 255, .12); color: #e6f1ff; }
  .diff-menu li[aria-selected="true"] { color: #7dffc0; background: rgba(110, 255, 200, .1); }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(2, 62px);
    gap: 10px;
    grid-template-areas: ". up ." "left down right";
  }
  .dpad button {
    appearance: none;
    cursor: pointer;
    border-radius: 15px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(120, 210, 255, .18);
    color: #cfeaff;
    font-size: 23px;
    line-height: 1;
    font-family: inherit;
  }
  .dpad button:active { background: rgba(110, 255, 200, .18); }
  .dpad [data-dir="up"] { grid-area: up; }
  .dpad [data-dir="left"] { grid-area: left; }
  .dpad [data-dir="down"] { grid-area: down; }
  .dpad [data-dir="right"] { grid-area: right; }
  /* 触屏设备显示方向键；窄窗口也显示，便于手机和调试时操作 */
  @media (hover: none) and (pointer: coarse), (max-width: 640px) {
    .dpad { display: grid; }
    /* 按钮放大后一行放不下，改为竖排：方向键紧贴棋盘，功能按钮移到下方 */
    .controls { flex-direction: column-reverse; gap: 10px; }
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 999px;
    color: #d8ffe9;
    background: rgba(16, 24, 37, .96);
    border: 1px solid rgba(120, 210, 255, .22);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .4);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    z-index: 50;
  }
  /* 无障碍：减弱动态效果时关闭过渡、震动、脉动 */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .toast { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>贪吃蛇</h1>
      <p class="hint" id="hint">方向键 / WASD 控制 · 空格 暂停 · R 重开 · P 暂停</p>
    </div>
    <div class="scores">
      <div class="stat"><span>得分</span><strong id="score">0</strong></div>
      <div class="stat"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </div>

  <div class="board" id="board">
    <canvas id="game"></canvas>
    <div class="overlay show" id="overlay">
      <p class="ov-title" id="ovTitle">准备好了吗？</p>
      <p class="ov-desc" id="ovDesc">按 空格 / 方向键 开始</p>
      <button class="btn ov-btn" id="ovBtn">开始游戏</button>
    </div>
  </div>

  <div class="controls">
    <div class="actions">
      <button class="btn ghost" id="pauseBtn">暂停</button>
      <button class="btn ghost" id="restartBtn">重新开始</button>
      <div class="diff" id="diff">
        <button class="diff-btn" id="diffBtn" type="button" aria-haspopup="listbox" aria-expanded="false">简单</button>
        <ul class="diff-menu" id="diffMenu" role="listbox">
          <li role="option" data-value="easy">简单</li>
          <li role="option" data-value="normal">普通</li>
          <li role="option" data-value="hard">困难</li>
        </ul>
      </div>
    </div>
    <div class="dpad" id="dpad">
      <button data-dir="up" aria-label="上">▲</button>
      <button data-dir="left" aria-label="左">◀</button>
      <button data-dir="down" aria-label="下">▼</button>
      <button data-dir="right" aria-label="右">▶</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- 常量 & 配置 ---------- */
  var COLS = 20, ROWS = 20, CELL = 30;
  var W = COLS * CELL, H = ROWS * CELL;
  var STORE_KEY = 'html-snake-best';
  var DIFF_STORE = 'html-snake-diff';

  var MAX_PARTICLES   = 60;       // 粒子上限（超过时丢弃最旧的）
  var BURST_COUNT     = 14;       // 每次吃食物爆开的粒子数
  var GAMEOVER_SHAKE  = 15;       // 撞墙震动幅度
  var EAT_SHAKE       = 6;        // 吃食物震动幅度
  var TOUCH_SWIPE_PCT = 0.03;     // 触屏滑动阈值：画布宽度的 3%
  var DIR_QUEUE_MAX   = 3;        // 方向队列最大缓存步数（防止连按丢输入）

  // 难度表：初始步长 ms / 每吃一颗减多少 / 最快步长
  var DIFFS = {
    easy:   { label: '简单', base: 220, tick: 2,   min: 130 },
    normal: { label: '普通', base: 150, tick: 4.5, min: 65  },
    hard:   { label: '困难', base: 110, tick: 6,   min: 45  }
  };

  // localStorage 安全读写：隐私模式下会抛异常
  function safeLSGet(key, fallback) {
    try { var v = localStorage.getItem(key); return v == null ? fallback : v; }
    catch (e) { return fallback; }
  }
  function safeLSSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }

  // 系统减弱动态效果（用于 JS 层面关闭粒子/震动/脉动）
  var REDUCE_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- DOM ---------- */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovDesc = document.getElementById('ovDesc');
  var ovBtn = document.getElementById('ovBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var restartBtn = document.getElementById('restartBtn');
  var board = document.getElementById('board');

  // 触屏设备下把提示换成触控说明（键盘说明对手机没有意义）
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    document.getElementById('hint').textContent = '在棋盘上滑动转向 · 也可点下方方向键 · 点暂停可中断';
  }

  /* ---------- 静态背景（只画一次） ---------- */
  var bg = document.createElement('canvas');
  bg.width = W * dpr;
  bg.height = H * dpr;
  var bctx = bg.getContext('2d');
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  (function paintBg() {
    var g = bctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0c1626');
    g.addColorStop(1, '#070c15');
    bctx.fillStyle = g;
    bctx.fillRect(0, 0, W, H);
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) {
          bctx.fillStyle = 'rgba(120,220,255,0.025)';
          bctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }
    bctx.strokeStyle = 'rgba(110,200,255,0.055)';
    bctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      bctx.beginPath();
      bctx.moveTo(i * CELL + .5, 0);
      bctx.lineTo(i * CELL + .5, H);
      bctx.stroke();
    }
    for (var j = 1; j < ROWS; j++) {
      bctx.beginPath();
      bctx.moveTo(0, j * CELL + .5);
      bctx.lineTo(W, j * CELL + .5);
      bctx.stroke();
    }
  })();

  /* ---------- 状态 ---------- */
  var snake, prevSnake, dir, queue, food, score, best, stepTime, acc, last, state;
  var particles = [], partWriteIdx = 0;   // 粒子：扁平数组 + writeIdx 原地压缩
  var shake = 0, foodPulse = 0;
  var shakeDir = { x: 0, y: 0 };
  var smoothT = 1;
  var freeCells = [];            // 空闲格子数组（placeFood O(1) 随机选）
  var rafRunning = false;        // rAF 开关：暂停/离屏时停
  var rafId = 0;

  best = parseInt(safeLSGet(STORE_KEY, '0'), 10);
  if (!isFinite(best) || best < 0) best = 0;
  var savedBest = best;   // 已写盘的最高分；运行中 best 只更新内存和 UI
  bestEl.textContent = best;

  var diffKey = safeLSGet(DIFF_STORE, 'easy');
  var diff = DIFFS[diffKey] || DIFFS.easy;

  /* ---------- 空闲格子维护 ---------- */
  function rebuildFreeCells() {
    freeCells.length = 0;
    var occupied = {};
    for (var i = 0; i < snake.length; i++) occupied[snake[i].x + ',' + snake[i].y] = true;
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!occupied[x + ',' + y]) freeCells.push({ x: x, y: y });
      }
    }
  }

  function placeFood() {
    rebuildFreeCells();
    if (!freeCells.length) {
      gameWin();
      return;
    }
    food = freeCells[Math.floor(Math.random() * freeCells.length)];
  }

  /* ---------- 重置 ---------- */
  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    smoothT = 1;
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    stepTime = Math.round(diff.base);
    acc = 0;
    particles.length = 0;
    partWriteIdx = 0;
    shake = 0;
    shakeDir = { x: 0, y: 0 };
    foodPulse = 0;
    scoreEl.textContent = '0';
    placeFood();
    state = 'ready';
    pauseBtn.textContent = '暂停';
    showOverlay('准备好了吗？', '按 空格 / 方向键 开始', '开始游戏');
    draw();
  }

  function showOverlay(title, desc, btnText) {
    ovTitle.textContent = title;
    ovDesc.textContent = desc;
    ovBtn.textContent = btnText;
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  /* ---------- 流程控制 ---------- */
  function start() {
    if (state === 'running') return;
    state = 'running';
    hideOverlay();
    pauseBtn.textContent = '暂停';
    acc = 0;
    last = performance.now();
    ensureRaf();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      pauseBtn.textContent = '继续';
      showOverlay('已暂停', '按 空格 继续游戏', '继续游戏');
      stopRaf();
    } else if (state === 'paused') {
      state = 'running';
      hideOverlay();
      pauseBtn.textContent = '暂停';
      last = performance.now();
      ensureRaf();
    }
  }

  function action() {
    if (state === 'ready' || state === 'over' || state === 'win') {
      if (state === 'over' || state === 'win') reset();
      start();
    } else {
      togglePause();
    }
  }

  function restart() {
    stopRaf();
    reset();
    start();
  }

  function gameOver() {
    state = 'over';
    if (!REDUCE_MOTION) {
      shake = GAMEOVER_SHAKE;
      shakeDir = { x: -dir.x, y: -dir.y };
    }
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
    if (best > savedBest) {
      savedBest = best;
      safeLSSet(STORE_KEY, String(best));
    }
    pauseBtn.textContent = '暂停';
    showOverlay('游戏结束', '本局得分 ' + score + ' · 最高 ' + best, '再来一局');
    // 不立即 stopRaf：让粒子余烬在 loop 里自然衰减完后自动停
  }

  function gameWin() {
    state = 'win';
    food = null;
    // 与 gameOver 对齐：运行中只更新 UI，终局最多写盘一次
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
    if (best > savedBest) {
      savedBest = best;
      safeLSSet(STORE_KEY, String(best));
    }
    pauseBtn.textContent = '暂停';
    showOverlay('恭喜通关！', '本局得分 ' + score + ' · 最高 ' + best, '再来一局');
    // 通关音效：三音上行，和 gameOver 的单音下落区分
    playTone(660, 0.12, 'square', 0.06);
    setTimeout(function () { playTone(880, 0.12, 'square', 0.06); }, 120);
    setTimeout(function () { playTone(1320, 0.2, 'square', 0.05); }, 240);
    stopRaf();
  }

  /* ---------- 碰撞判定 ---------- */
  // skipTail: 吃到食物时蛇还没删尾部，skipTail=false 让尾部也参与自撞判定；否则排除尾部
  function isCollision(head, skipTail) {
    var limit = snake.length - (skipTail ? 0 : 1);
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return true;
    }
    return false;
  }

  /* ---------- 游戏逻辑 ---------- */
  function step() {
    if (dpadHoldDir) pushDir(dpadHoldDir);
    if (queue.length) {
      var nd = queue.shift();
      if (!(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
    }
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    var eating = food && head.x === food.x && head.y === food.y;
    if (isCollision(head, eating)) {
      gameOver();
      return;
    }

    prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
    snake.unshift(head);

    if (eating) {
      score += 1;
      scoreEl.textContent = score;
      stepTime = Math.max(diff.min, Math.round(diff.base - score * diff.tick));
      if (!REDUCE_MOTION) {
        burst(head.x, head.y);
        shake = EAT_SHAKE;
        // 震动方向取横向移动时竖震、纵向移动时横震，避开当前移动方向
        if (dir.x !== 0) {
          shakeDir = { x: 0, y: Math.random() < 0.5 ? -1 : 1 };
        } else {
          shakeDir = { x: Math.random() < 0.5 ? -1 : 1, y: 0 };
        }
      }
      placeFood();
      playTone(660, 0.08, 'square', 0.06);
      if (score > best) {
        best = score;
        bestEl.textContent = best;
      }
    } else {
      snake.pop();
    }
  }

  function pushDir(d) {
    var ref = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === ref.x && d.y === ref.y) return;      // 同方向忽略（去重）
    if (d.x === -ref.x && d.y === -ref.y) return;    // 反方向忽略
    if (queue.length >= DIR_QUEUE_MAX) return;
    queue.push(d);
  }

  /* ---------- 粒子（扁平数组 + writeIdx 原地压缩） ---------- */
  function burst(cx, cy) {
    // 粒子过多时先丢弃最旧的，再继续生成
    if (particles.length > MAX_PARTICLES - BURST_COUNT) {
      partWriteIdx = 0;
      particles.length = 0;
    }
    var px = cx * CELL + CELL / 2, py = cy * CELL + CELL / 2, i;
    for (i = 0; i < BURST_COUNT; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 50 + Math.random() * 110;
      particles[partWriteIdx++] = {
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        hue: 135 + Math.random() * 45
      };
    }
  }

  function updateParticles(dt) {
    if (partWriteIdx === 0) return;
    var s = dt / 1000, i, p, w = 0;
    for (i = 0; i < partWriteIdx; i++) {
      p = particles[i];
      p.x += p.vx * s;
      p.y += p.vy * s;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= s * 1.9;
      if (p.life > 0) particles[w++] = p;
    }
    partWriteIdx = w;
    particles.length = w;
  }

  /* ---------- 渲染 ---------- */
  function roundRect(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(-20, -20, W + 40, H + 40);

    ctx.save();
    if (shake > 0) {
      ctx.translate(shakeDir.x * shake, shakeDir.y * shake);
    }

    ctx.drawImage(bg, 0, 0, W, H);

    drawFood();
    drawSnake();
    drawParticles();

    ctx.restore();
  }

  function drawFood() {
    if (!food) return;
    var t = REDUCE_MOTION ? 0.5 : (Math.sin(foodPulse / 360) + 1) / 2;
    var cx = food.x * CELL + CELL / 2;
    var cy = food.y * CELL + CELL / 2;
    var r = CELL * 0.3 + t * CELL * 0.055;

    ctx.save();
    ctx.shadowColor = 'rgba(255,77,125,0.85)';
    ctx.shadowBlur = 16 + t * 12;
    ctx.fillStyle = '#ff4d7d';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.34, cy - r * 0.34, r * 0.26, 0, Math.PI * 2);
    ctx.fill();
  }

  function lerp(a, b, k) { return a + (b - a) * k; }

  function drawSnake() {
    var len = snake.length, i, cur, prv, ratio, pad, x, y, w, h, r;
    var e = smoothT;

    for (i = len - 1; i >= 0; i--) {
      cur = snake[i];
      prv = prevSnake[Math.min(i, prevSnake.length - 1)] || cur;
      ratio = len > 1 ? i / (len - 1) : 0;
      pad = i === 0 ? 2.5 : 3.5;
      x = lerp(prv.x, cur.x, e) * CELL + pad;
      y = lerp(prv.y, cur.y, e) * CELL + pad;
      w = CELL - pad * 2;
      h = CELL - pad * 2;
      r = i === 0 ? 9 : 7;

      if (i === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(90,255,190,0.75)';
        ctx.shadowBlur = 16;
      }
      ctx.fillStyle = 'hsl(' + (152 + ratio * 34) + ', 88%, ' + (60 - ratio * 20) + '%)';
      roundRect(x, y, w, h, r);
      ctx.fill();
      if (i === 0) ctx.restore();
    }

    /* 眼睛（跟随插值后的蛇头） */
    var nh = snake[0];
    var ph = prevSnake[0] || nh;
    var hx = lerp(ph.x, nh.x, e) * CELL + CELL / 2;
    var hy = lerp(ph.y, nh.y, e) * CELL + CELL / 2;
    var fx = dir.x * CELL * 0.14;
    var fy = dir.y * CELL * 0.14;
    var ox = -dir.y * CELL * 0.19;
    var oy = dir.x * CELL * 0.19;
    var er = CELL * 0.125;

    ctx.fillStyle = '#061410';
    ctx.beginPath();
    ctx.arc(hx + fx + ox, hy + fy + oy, er, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx + fx - ox, hy + fy - oy, er, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawParticles() {
    if (partWriteIdx === 0) return;
    var i, p;
    for (i = 0; i < partWriteIdx; i++) {
      p = particles[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = 'hsl(' + p.hue + ', 92%, 66%)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1 + p.life * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 主循环（可停可启） ---------- */
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (!rafRunning) return;

    if (!last) last = now;
    var dt = now - last;
    last = now;
    if (dt > 100) dt = 100;

    // 食物脉动只在 running 推进（B4）
    if (!REDUCE_MOTION && state === 'running') foodPulse += dt;

    if (state === 'running') {
      acc += dt;
      while (acc >= stepTime && state === 'running') {
        acc -= stepTime;
        step();
      }
      if (state === 'running') smoothT = Math.min(1, acc / stepTime);
    }

    // shake 只在 running 衰减；paused / over 保持当前画面状态
    if (state === 'running' && shake > 0) {
      shake = Math.max(0, shake - dt * 0.022);
    }

    // 粒子更新：running 和 over 都保留，让 gameOver 余烬能飘完；paused/ready/win 冻结
    if (state === 'running' || state === 'over') updateParticles(dt);

    draw();

    // over 态余烬衰减完后自动停 rAF
    if (state === 'over' && partWriteIdx === 0) {
      stopRaf();
      return;
    }
  }

  function ensureRaf() {
    if (!rafRunning) {
      rafRunning = true;
      last = performance.now();
    }
    if (!rafId) rafId = requestAnimationFrame(loop);
  }
  function stopRaf() {
    rafRunning = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }

  /* ---------- 音效（Web Audio 方波，零外部依赖） ---------- */
  var audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function playTone(freq, dur, type, gain) {
    if (REDUCE_MOTION) return;
    try {
      ensureAudio();
      if (!audioCtx) return;
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.7), t + dur);
      g.gain.setValueAtTime(gain || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur);
    } catch (e) {}
  }

  /* ---------- 输入 ---------- */
  var KEYS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
  };
  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };

  window.addEventListener('keydown', function (e) {
    // 带 Ctrl / Cmd / Alt 的组合键交给浏览器（如 Ctrl+R、Ctrl+Shift+R 刷新）
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') {
      e.preventDefault();
      action();
      return;
    }
    if (e.code === 'KeyP') {
      e.preventDefault();
      if (state === 'running' || state === 'paused') togglePause();
      return;
    }
    if (e.code === 'KeyR') {
      e.preventDefault();
      restart();
      return;
    }
    var d = KEYS[e.code];
    if (d) {
      e.preventDefault();
      if (state === 'ready') start();
      if (state === 'running') pushDir(d);
    }
  });

  ovBtn.addEventListener('click', function () {
    this.blur();
    ensureAudio();
    if (!overlay.classList.contains('show')) return;
    if (state === 'paused') togglePause();
    else { if (state === 'over' || state === 'win') reset(); start(); }
  });

  pauseBtn.addEventListener('click', function () {
    this.blur();
    ensureAudio();
    if (state === 'running' || state === 'paused') togglePause();
  });

  restartBtn.addEventListener('click', function () {
    this.blur();
    ensureAudio();
    restart();
  });

  /* ---------- 难度下拉 ---------- */
  var diffWrap = document.getElementById('diff');
  var diffBtn = document.getElementById('diffBtn');
  var diffMenu = document.getElementById('diffMenu');
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;

  function showToast(text) {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.style.transition = REDUCE_MOTION ? 'none' : '';
    toastEl.style.opacity = '1';
    toastTimer = setTimeout(function () {
      toastEl.style.opacity = '0';
      toastTimer = 0;
    }, 1400);
  }

  function closeDiff() {
    diffWrap.classList.remove('open');
    diffBtn.setAttribute('aria-expanded', 'false');
  }

  // 自动判断弹向：优先向上，若视口上方空间不够则向下
  function openDiff() {
    diffWrap.classList.add('open');
    diffBtn.setAttribute('aria-expanded', 'true');
    // 先向上展开（CSS 默认），再检测是否超出视口
    var rect = diffWrap.getBoundingClientRect();
    var menuEl = diffMenu;
    // 等一帧让布局完成
    requestAnimationFrame(function () {
      var menuRect = menuEl.getBoundingClientRect();
      if (menuRect.top < 4) {
        // 上方不够，改向下展开
        menuEl.style.bottom = 'auto';
        menuEl.style.top = 'calc(100% + 6px)';
        menuEl.style.transform = 'translateY(-4px)';
      } else {
        menuEl.style.bottom = '';
        menuEl.style.top = '';
        menuEl.style.transform = '';
      }
    });
  }

  function setDiff(key, save, silent) {
    if (!DIFFS[key]) key = 'easy';
    diff = DIFFS[key];
    diffKey = key;
    diffBtn.textContent = diff.label;
    for (var i = 0; i < diffMenu.children.length; i++) {
      var li = diffMenu.children[i];
      li.setAttribute('aria-selected', li.dataset.value === key ? 'true' : 'false');
    }
    if (save) safeLSSet(DIFF_STORE, key);
    if (state === 'running' || state === 'paused') {
      stepTime = Math.max(diff.min, Math.round(diff.base - score * diff.tick));
    }
    if (!silent) {
      playTone(880, 0.05, 'triangle', 0.04);
      showToast('已切换为' + diff.label);
    }
  }

  setDiff(diffKey, false, true);

  diffBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    ensureAudio();
    var isOpen = diffWrap.classList.contains('open');
    if (isOpen) closeDiff(); else openDiff();
    this.blur();
  });

  diffMenu.addEventListener('click', function (e) {
    var li = e.target.closest('[data-value]');
    if (!li) return;
    setDiff(li.dataset.value, true);
    closeDiff();
  });

  document.addEventListener('click', function (e) {
    if (!diffWrap.contains(e.target)) closeDiff();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDiff();
  });

  /* ---------- D-Pad：点击 + 长按与 step 同步转向 ---------- */
  var dpad = document.getElementById('dpad');
  var dpadHoldDir = null;

  function dpadStopHold() {
    dpadHoldDir = null;
  }

  dpad.addEventListener('touchstart', function (e) {
    ensureAudio();
    var btn = e.target.closest('[data-dir]');
    if (!btn) return;
    e.preventDefault();
    var d = DIRS[btn.dataset.dir];
    if (state === 'ready' || state === 'over' || state === 'win') action();
    if (d) dpadHoldDir = d;
  }, { passive: false });

  dpad.addEventListener('touchend', dpadStopHold);
  dpad.addEventListener('touchcancel', dpadStopHold);
  dpad.addEventListener('touchleave', dpadStopHold);

  dpad.addEventListener('click', function (e) {
    ensureAudio();
    var btn = e.target.closest('[data-dir]');
    if (!btn) return;
    var d = DIRS[btn.dataset.dir];
    if (state === 'ready' || state === 'over' || state === 'win') action();
    if (state === 'running' && d) pushDir(d);
  });

  /* ---------- 触屏滑动（相对画布宽度的 3%，单指锁定） ---------- */
  var touchStart = null;
  var touchStartId = null;   // 只跟踪第一根手指，避免多指干扰
  board.addEventListener('touchstart', function (e) {
    if (touchStart) return;   // 已有跟踪中的手指，忽略新触点
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
    touchStartId = t.identifier;
  }, { passive: true });

  board.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  board.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    ensureAudio();
    // 在 changedTouches 里找到我们跟踪的那根手指
    var t = null;
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchStartId) { t = e.changedTouches[i]; break; }
    }
    if (!t) return;   // 其他手指的 touchend，忽略
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    touchStartId = null;
    // 阈值：画布实际宽度的 3%（相对画布本身，避免硬编码在不同设备上体验不一致）
    var boardW = board.getBoundingClientRect().width;
    var thresh = Math.max(12, boardW * TOUCH_SWIPE_PCT);
    if (Math.abs(dx) < thresh && Math.abs(dy) < thresh) return;
    var d = Math.abs(dx) > Math.abs(dy)
      ? { x: dx > 0 ? 1 : -1, y: 0 }
      : { x: 0, y: dy > 0 ? 1 : -1 };
    if (state === 'ready' || state === 'over' || state === 'win') action();
    if (state === 'running') pushDir(d);
  }, { passive: true });

  /* ---------- 离屏自动暂停 ---------- */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'running') togglePause();
  });

  /* ---------- 启动 ---------- */
  reset();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
